<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Prescriptions — HealthBridge" />
    <title>Prescriptions — HealthBridge</title>
  <link rel="icon" type="image/svg+xml" href="../../favicon.svg" />
      <link rel="stylesheet" href="../../assets/public-v2/css/tokens.css?v=1" />
  <link rel="stylesheet" href="../../assets/public-v2/css/base.css?v=1" />
  <link rel="stylesheet" href="../../assets/public-v2/css/components.css?v=11" />
  <link rel="stylesheet" href="../../assets/public-v2/css/pages/patient-dashboard.css?v=9" />
  <script src="../../assets/public-v2/js/core/site.js?v=2"></script>
  <script defer src="../../assets/public-v2/js/core/patient-shell.js?v=4"></script>
</head>
  <body>
    <div id="navbar-container"></div>
    <div class="dashboard">
      <div id="sidebar-container"></div>
      <main class="main-content">
        <div class="portal-content">
          <div
            class="page-header patient-rx-page-header"
          >
            <div>
              <h1>
                <i
                  class="fas fa-prescription-bottle-medical"
                  aria-hidden="true"
                ></i>
                My Prescriptions
              </h1>
              <p class="page-subtitle">
                View and manage medications prescribed by your healthcare team
              </p>
            </div>
          </div>

          <!-- Search & Filter Controls -->
          <div
            class="patient-rx-controls"
          >
            <div class="search-bar patient-rx-search">
              <i class="fas fa-search search-icon" aria-hidden="true"></i>
              <input
                type="text"
                id="rx-search-input"
                placeholder="Search by medication, doctor name, or department..."
              />
            </div>
            <div class="notif-filters" id="rx-filter-chips">
              <button
                class="notif-filter-btn filter-chip active"
                data-filter="all"
              >
                All Prescriptions
              </button>
              <button class="notif-filter-btn filter-chip" data-filter="Active">
                Active
              </button>
              <button
                class="notif-filter-btn filter-chip"
                data-filter="Completed"
              >
                Completed
              </button>
              <button
                class="notif-filter-btn filter-chip"
                data-filter="Cancelled"
              >
                Cancelled
              </button>
            </div>
          </div>

          <!-- Prescriptions Container -->
          <div id="prescriptions-container">
            <div class="skeleton-loader">
              <div
                class="skeleton skeleton-card patient-rx-skeleton-card"
              ></div>
              <div
                class="skeleton skeleton-card patient-rx-skeleton-card"
              ></div>
              <div class="skeleton skeleton-card patient-rx-skeleton-card"></div>
            </div>
          </div>
        </div>
      </main>
    </div>
    </body>
</html>
