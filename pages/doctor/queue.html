<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Patients waiting to be seen, with the clinical workspace one click away." />
  <title>Patient Queue — HealthBridge</title>
  <link rel="icon" type="image/svg+xml" href="../../favicon.svg" />
  <link rel="stylesheet" href="../../assets/public-v2/css/tokens.css?v=1" />
  <link rel="stylesheet" href="../../assets/public-v2/css/base.css?v=1" />
  <link rel="stylesheet" href="../../assets/public-v2/css/components.css?v=21" />
  <link rel="stylesheet" href="../../assets/public-v2/css/pages/doctor-dashboard.css?v=18" />
  <script>try{if(localStorage.getItem("hb_doctor_sidebar")==="collapsed"){document.documentElement.classList.add("doctor-sb-collapsed");}}catch(e){}</script>
  <script src="../../assets/public-v2/js/core/site.js?v=12"></script>
  <script defer src="../../assets/public-v2/js/core/helpers.js?v=1"></script>
  <script defer src="../../assets/public-v2/js/core/shell-core.js?v=3"></script>
  <script defer src="../../assets/public-v2/js/core/doctor-shell.js?v=8"></script>
  <script defer src="../../assets/public-v2/js/pages/doctor-queue.js?v=2"></script>
</head>
<body>
  <div id="navbar-container"></div>

  <div class="dashboard">
    <div id="sidebar-container"></div>

    <main class="main-content doctor-main--list" id="doctor-main" aria-busy="true">
      <div class="doctor-page doctor-listpage doctor-queue">

        <header class="doctor-listhead doctor-rise" style="--i:0">
          <p class="doctor-page__eyebrow">Patient care</p>
          <h1>Patient Queue</h1>
          <p class="doctor-page__lede">Patients waiting to be seen, with the clinical workspace one click away.</p>
        </header>

        <section class="doctor-qsum" aria-label="Queue summary">
          <div class="doctor-qsum__item doctor-rise" style="--i:1">
            <strong class="doctor-qsum__value" id="q-sum-waiting">–</strong>
            <span class="doctor-qsum__label">Waiting now</span>
            <span class="doctor-qsum__ctx">visits not yet started</span>
          </div>
          <div class="doctor-qsum__item doctor-rise" style="--i:1">
            <strong class="doctor-qsum__value" id="q-sum-today">–</strong>
            <span class="doctor-qsum__label">Today</span>
            <span class="doctor-qsum__ctx">on today's schedule</span>
          </div>
          <div class="doctor-qsum__item doctor-rise" style="--i:1">
            <strong class="doctor-qsum__value" id="q-sum-upcoming">–</strong>
            <span class="doctor-qsum__label">Upcoming</span>
            <span class="doctor-qsum__ctx">booked beyond today</span>
          </div>
        </section>

        <div class="doctor-filters doctor-rise" style="--i:2" id="q-filters" role="group" aria-label="Filter queue by status"></div>

        <div id="q-groups"><p class="doctor-empty">Loading your queue…</p></div>

        <p class="doctor-alert" id="q-error" role="alert" hidden>Your queue could not be loaded. Check your connection and refresh the page.</p>

      </div>
    </main>
  </div>
</body>
</html>
