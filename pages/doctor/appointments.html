<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Every booking on your calendar — search, filter, and open the clinical workspace." />
  <title>Appointments — HealthBridge</title>
  <link rel="icon" type="image/svg+xml" href="../../favicon.svg" />
  <link rel="stylesheet" href="../../assets/public-v2/css/tokens.css?v=1" />
  <link rel="stylesheet" href="../../assets/public-v2/css/base.css?v=1" />
  <link rel="stylesheet" href="../../assets/public-v2/css/components.css?v=18" />
  <link rel="stylesheet" href="../../assets/public-v2/css/pages/doctor-dashboard.css?v=18" />
  <script>try{if(localStorage.getItem("hb_doctor_sidebar")==="collapsed"){document.documentElement.classList.add("doctor-sb-collapsed");}}catch(e){}</script>
  <script src="../../assets/public-v2/js/core/site.js?v=8"></script>
  <script defer src="../../assets/public-v2/js/core/helpers.js?v=1"></script>
  <script defer src="../../assets/public-v2/js/core/shell-core.js?v=1"></script>
  <script defer src="../../assets/public-v2/js/core/doctor-shell.js?v=8"></script>
  <script defer src="../../assets/public-v2/js/pages/doctor-appointments.js?v=2"></script>
</head>
<body>
  <div id="navbar-container"></div>

  <div class="dashboard">
    <div id="sidebar-container"></div>

    <main class="main-content doctor-main--list" id="doctor-main" aria-busy="true">
      <div class="doctor-page doctor-listpage doctor-appts">

        <header class="doctor-listhead doctor-rise" style="--i:0">
          <p class="doctor-page__eyebrow">Patient care</p>
          <h1>Appointments</h1>
          <p class="doctor-page__lede">Every booking on your calendar — search, filter, and open the clinical workspace.</p>
        </header>

        <section class="doctor-panel doctor-controls doctor-rise" style="--i:1" aria-label="Search and filter appointments">
          <label class="doctor-search">
            <span class="doctor-search__label">Search appointments</span>
            <input type="search" id="a-search" placeholder="Search by patient name…" autocomplete="off" />
          </label>
          <div class="doctor-filters" id="a-filters" role="group" aria-label="Filter appointments by status"></div>
          <p class="doctor-results" id="a-results" aria-live="polite"></p>
        </section>

        <section class="doctor-panel doctor-alist" aria-label="All appointments">
          <div id="a-rows"><p class="doctor-empty">Loading your appointments…</p></div>
        </section>

        <p class="doctor-alert" id="a-error" role="alert" hidden>Your appointments could not be loaded. Check your connection and refresh the page.</p>

      </div>
    </main>
  </div>
</body>
</html>
